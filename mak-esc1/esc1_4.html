		<FONT color="#00FFFF">
		４．基板のカット（金のこか糸鋸、やすりが必要）
		<BR>
		</FONT>
		　コナミの基板は大きいので、ゴールドキャパシタの収まるスペースがありません。
		そこで、基板の一部をカットしてスペースを確保します。私は金鋸でカットし、ヤスリで削りました。
		ニッパーなどで無理矢理カットしても良いかも知れません。
		実体図を参考にしてカットします。このカットで5Vのつながりもカットされますが、
		HC74, HC133, HC139の5Vを接続する時に一緒につなげますので気にしないでください。<BR>
		　薄型のゴールドキャパシタやリチウム電池を使う場合は基板をカットしなくても大丈夫です。<BR>
