		サラグラ
		<BR>
		</FONT>
		　「サラマンダ（沙羅曼陀）」＋「グラディウス２」＝「サラグラ」です。沙羅曼陀単体で遊んでいても、真のエンディングにはたどり着きません。別のスロットにグラディウス２を挿す必要があります。普通は、スロットが2個しかありませんので、そうなると「新10倍カートリッジ」が使えなくなります。それを解消するために、似非SCCに沙羅曼陀とグラディウス２をインストールして１つのスロットでサラグラを実現するプログラムがあります。そのプログラムを使うと、さらに新10倍カートリッジの面セレクト機能でいきなりヴェノム艦と戦うこともできるようです。
		<BR>
		　プログラムは<A href="http://niga2.sytes.net/kmizuo/" target="_blank">ＯＫＥＩさん</A>のサイトにあります。
