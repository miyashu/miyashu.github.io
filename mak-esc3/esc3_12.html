		　2212P003の36,38,39,40ピン(MA14,MA16,MA17,MA18)を628512の2,30,31,1ピン(A16,A17,A15,A18)と接続します。

		まとめてはんだ付けします。A15は表面の628512と裏面の628512それぞれにつなげなくてはなりません。<BR>
