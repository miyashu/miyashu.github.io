		<FONT color="#00FFFF">
		３．カートリッジの分解
		<BR>
		</FONT>
		　まず、ゲームのカートリッジを分解します。
		<BR>
		　カートリッジには何種類かありますが、基本的にねじを外して開くだけです。ねじがシールの下に隠れていることがありますので注意してください。また、内部につめがあって開けにくい場合もあります。完全にケースを開けられなくても、ちょっと開いた段階で基板を抜き出し、改造後にちょっと開いて押し込んでも良いでしょう。
		<BR>
		　基板がでてきたら、「LZ93A13」と書かれたチップが載っていることと、基板の裏に「TAS-1M016S」または「TAS-1M008S」とかかれていることを確認します。
