<BODY><H2>１３　ケースを閉じる</H2>
　ケースを閉じれば完成です。しかし、ケースによっては基板の裏側にとりつけたＳＲＡＭが邪魔でだったりして
閉じない場合があります。別のソフトのケースを使うのが手っ取り早いのですが、そうもいかないときは、
彫刻刀かなにかでケースを削ってしまいましょう。<BR><BR>
