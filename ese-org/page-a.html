<BODY><H2>１０　パスコンは・・・？</H2>
　普通、ＩＣ１個につき１つの割合でバイパスコンデンサ（通称パスコン）を付けます。
まぁ、最低でもＩＣ２個につき１つの割合で付けます。<BR>
　パスコンはＩＣのＶＤＤとＧＮＤの間にとりつけるコンデンサで、0.01μＦから0.1μＦ程度のものが使われます。
ここではＩＣが４つで、もともと基板に２つ載っている（茶色い部品です）ものとして、工作手順に含めていませんが、
もし１つしかなかったり、不安に思うときは自分で新たに付けましょう。<BR>
　パスコンが無いと、高速な動作の際に誤動作をすることがあります。<BR><BR>
